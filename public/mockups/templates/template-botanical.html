<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumeries - Botanical Eucalyptus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #faf8f3;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Background Layer - Warm Beige Linen */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f5f1e8 0%, #ebe5d9 25%, #f2ede4 50%, #ebe5d9 75%, #f5f1e8 100%);
      z-index: 1;
    }

    .background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(139,119,101,0.02) 1px, rgba(139,119,101,0.02) 2px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139,119,101,0.02) 2px, rgba(139,119,101,0.02) 4px);
      z-index: 1;
      mix-blend-mode: multiply;
    }

    .background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(200,180,160,0.05) 0%, transparent 70%);
      z-index: 2;
    }

    /* Soft light effect */
    .soft-light {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.15) 0%, transparent 60%);
      z-index: 3;
      pointer-events: none;
    }

    /* Poster Slot */
    .poster-slot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 540px;
      height: 680px;
      z-index: 10;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      border: 2px solid #d4af7a;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(100, 80, 60, 0.2);
    }

    .poster-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-slot::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent 0%, rgba(200, 170, 140, 0.08) 100%);
      z-index: 20;
      pointer-events: none;
    }

    .poster-slot::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      box-shadow: inset 0 0 40px rgba(100, 80, 60, 0.08);
      z-index: 21;
      pointer-events: none;
    }

    /* Botanical Elements */
    .botanical-container {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
    }

    .eucalyptus-branch {
      position: absolute;
      opacity: 0.7;
    }

    .branch-top-left {
      top: 40px;
      left: 30px;
      width: 180px;
      height: 200px;
    }

    .branch-top-right {
      top: 50px;
      right: 40px;
      width: 160px;
      height: 180px;
    }

    .branch-bottom-left {
      bottom: 60px;
      left: 50px;
      width: 140px;
      height: 160px;
    }

    .branch-bottom-right {
      bottom: 40px;
      right: 30px;
      width: 170px;
      height: 190px;
    }

    /* Botanical line art */
    .botanical-accent {
      position: absolute;
      opacity: 0.5;
    }

    .accent-leaf-1 {
      top: 280px;
      right: 60px;
      width: 60px;
      height: 70px;
    }

    .accent-leaf-2 {
      bottom: 280px;
      left: 50px;
      width: 50px;
      height: 60px;
    }

    .accent-leaf-3 {
      top: 600px;
      right: 100px;
      width: 40px;
      height: 50px;
    }

    /* Frame Gold Accent */
    .frame-accent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 720px;
      z-index: 9;
      pointer-events: none;
    }

    .frame-accent::before {
      content: '';
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border: 3px solid #d4af7a;
      box-shadow: 0 8px 20px rgba(100, 80, 60, 0.15);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <!-- Background -->
    <div class="background"></div>
    <div class="soft-light"></div>

    <!-- Botanical Elements -->
    <div class="botanical-container">
      <!-- Top Left Branch -->
      <svg class="eucalyptus-branch branch-top-left" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="leafGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7a9a5e;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#5a7a3e;stop-opacity:0.8" />
          </linearGradient>
        </defs>
        <path d="M 100,10 Q 80,30 60,50 Q 40,70 20,90" stroke="#7a9a5e" stroke-width="2" fill="none" opacity="0.6"/>
        <ellipse cx="85" cy="35" rx="12" ry="18" fill="url(#leafGradient1)" transform="rotate(-30 85 35)"/>
        <ellipse cx="65" cy="55" rx="13" ry="19" fill="url(#leafGradient1)" transform="rotate(-35 65 55)"/>
        <ellipse cx="45" cy="75" rx="12" ry="18" fill="url(#leafGradient1)" transform="rotate(-40 45 75)"/>
        <ellipse cx="25" cy="95" rx="11" ry="17" fill="url(#leafGradient1)" transform="rotate(-45 25 95)"/>
        <path d="M 100,10 Q 120,35 130,60 Q 135,85 125,110" stroke="#7a9a5e" stroke-width="2.5" fill="none" opacity="0.7"/>
        <ellipse cx="115" cy="40" rx="11" ry="16" fill="url(#leafGradient1)" transform="rotate(25 115 40)"/>
        <ellipse cx="130" cy="70" rx="12" ry="17" fill="url(#leafGradient1)" transform="rotate(30 130 70)"/>
        <ellipse cx="125" cy="100" rx="13" ry="18" fill="url(#leafGradient1)" transform="rotate(35 125 100)"/>
      </svg>

      <!-- Top Right Branch -->
      <svg class="eucalyptus-branch branch-top-right" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="leafGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7a9a5e;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#5a7a3e;stop-opacity:0.8" />
          </linearGradient>
        </defs>
        <path d="M 80,20 Q 60,40 40,65 Q 25,85 15,110" stroke="#7a9a5e" stroke-width="2" fill="none" opacity="0.6"/>
        <ellipse cx="68" cy="35" rx="11" ry="17" fill="url(#leafGradient2)" transform="rotate(-25 68 35)"/>
        <ellipse cx="50" cy="55" rx="12" ry="18" fill="url(#leafGradient2)" transform="rotate(-30 50 55)"/>
        <ellipse cx="35" cy="80" rx="11" ry="17" fill="url(#leafGradient2)" transform="rotate(-35 35 80)"/>
        <path d="M 80,20 Q 100,30 115,50 Q 125,70 120,95" stroke="#7a9a5e" stroke-width="2" fill="none" opacity="0.7"/>
        <ellipse cx="95" cy="35" rx="11" ry="16" fill="url(#leafGradient2)" transform="rotate(20 95 35)"/>
        <ellipse cx="115" cy="55" rx="12" ry="17" fill="url(#leafGradient2)" transform="rotate(25 115 55)"/>
      </svg>

      <!-- Bottom Left Branch -->
      <svg class="eucalyptus-branch branch-bottom-left" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="leafGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7a9a5e;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#5a7a3e;stop-opacity:0.75" />
          </linearGradient>
        </defs>
        <path d="M 80,10 Q 60,30 45,55 Q 35,75 30,100" stroke="#7a9a5e" stroke-width="2" fill="none" opacity="0.6"/>
        <ellipse cx="70" cy="30" rx="10" ry="15" fill="url(#leafGradient3)" transform="rotate(-30 70 30)"/>
        <ellipse cx="53" cy="50" rx="11" ry="16" fill="url(#leafGradient3)" transform="rotate(-35 53 50)"/>
        <ellipse cx="40" cy="75" rx="10" ry="15" fill="url(#leafGradient3)" transform="rotate(-40 40 75)"/>
        <path d="M 80,10 Q 100,25 110,50" stroke="#7a9a5e" stroke-width="2" fill="none" opacity="0.65"/>
        <ellipse cx="92" cy="25" rx="10" ry="15" fill="url(#leafGradient3)" transform="rotate(20 92 25)"/>
      </svg>

      <!-- Bottom Right Branch -->
      <svg class="eucalyptus-branch branch-bottom-right" viewBox="0 0 190 210" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="leafGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7a9a5e;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#5a7a3e;stop-opacity:0.75" />
          </linearGradient>
        </defs>
        <path d="M 100,20 Q 80,40 60,65 Q 40,90 30,120" stroke="#7a9a5e" stroke-width="2" fill="none" opacity="0.6"/>
        <ellipse cx="85" cy="40" rx="11" ry="17" fill="url(#leafGradient4)" transform="rotate(-25 85 40)"/>
        <ellipse cx="65" cy="60" rx="12" ry="18" fill="url(#leafGradient4)" transform="rotate(-30 65 60)"/>
        <ellipse cx="48" cy="85" rx="11" ry="17" fill="url(#leafGradient4)" transform="rotate(-35 48 85)"/>
        <path d="M 100,20 Q 120,35 130,60 Q 135,85 125,110" stroke="#7a9a5e" stroke-width="2.5" fill="none" opacity="0.65"/>
        <ellipse cx="115" cy="40" rx="11" ry="17" fill="url(#leafGradient4)" transform="rotate(25 115 40)"/>
        <ellipse cx="130" cy="70" rx="12" ry="18" fill="url(#leafGradient4)" transform="rotate(30 130 70)"/>
      </svg>

      <!-- Accent Leaves -->
      <svg class="botanical-accent accent-leaf-1" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="accentLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8aaa6e;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#6a8a4e;stop-opacity:0.6" />
          </linearGradient>
        </defs>
        <path d="M 50,10 Q 30,20 20,40 Q 15,60 20,80 Q 30,100 50,110 Q 70,100 80,80 Q 85,60 80,40 Q 70,20 50,10 Z" fill="url(#accentLeaf1)" stroke="#6a8a4e" stroke-width="0.5" opacity="0.6"/>
        <path d="M 50,15 Q 50,60 50,105" stroke="#6a8a4e" stroke-width="0.5" opacity="0.4"/>
      </svg>

      <svg class="botanical-accent accent-leaf-2" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="accentLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8aaa6e;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#6a8a4e;stop-opacity:0.6" />
          </linearGradient>
        </defs>
        <path d="M 50,10 Q 30,20 20,40 Q 15,60 20,80 Q 30,100 50,110 Q 70,100 80,80 Q 85,60 80,40 Q 70,20 50,10 Z" fill="url(#accentLeaf2)" stroke="#6a8a4e" stroke-width="0.5" opacity="0.6"/>
        <path d="M 50,15 Q 50,60 50,105" stroke="#6a8a4e" stroke-width="0.5" opacity="0.4"/>
      </svg>

      <svg class="botanical-accent accent-leaf-3" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="accentLeaf3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8aaa6e;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#6a8a4e;stop-opacity:0.5" />
          </linearGradient>
        </defs>
        <path d="M 50,10 Q 30,20 20,40 Q 15,60 20,80 Q 30,100 50,110 Q 70,100 80,80 Q 85,60 80,40 Q 70,20 50,10 Z" fill="url(#accentLeaf3)" stroke="#6a8a4e" stroke-width="0.5" opacity="0.5"/>
        <path d="M 50,15 Q 50,60 50,105" stroke="#6a8a4e" stroke-width="0.5" opacity="0.3"/>
      </svg>
    </div>

    <!-- Frame Gold Accent -->
    <div class="frame-accent"></div>

    <!-- Poster Slot -->
    <div class="poster-slot" id="poster-slot" data-poster-url="">
      <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); color: #999; font-family: Arial, sans-serif; font-size: 14px; text-align: center;">
        Poster Image
      </div>
    </div>
  </div>

  <script>
    const POSTER_URL = ''; // Set poster image URL here - e.g., 'https://example.com/poster.jpg'

    function loadPoster() {
      const posterSlot = document.getElementById('poster-slot');

      if (POSTER_URL && POSTER_URL.trim() !== '') {
        const img = document.createElement('img');
        img.src = POSTER_URL;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.display = 'block';
        posterSlot.innerHTML = '';
        posterSlot.appendChild(img);
      }
    }

    // Load poster on page load
    window.addEventListener('load', loadPoster);

    // Also try loading immediately in case image is cached
    if (document.readyState === 'complete') {
      loadPoster();
    }

    // For Etsy 3000x3000px sizing, multiply all values by 2.78
    // ?size=3000 parameter can be added to URL for dynamic scaling
  </script>
</body>
</html>
