<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple Showcase - Lumeries Mockup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #0f0f0f;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0a0a0a 100%);
      overflow: hidden;
    }

    /* Subtle texture */
    .texture-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0.02) 4px
        );
      pointer-events: none;
    }

    /* Brand name at top */
    .brand-title {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif, sans-serif;
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 8px;
      color: #d4af37;
      text-transform: uppercase;
      z-index: 20;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }

    /* Container for three posters */
    .showcase-container {
      position: absolute;
      width: 100%;
      height: 600px;
      top: 150px;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    /* Poster slots */
    .poster-slot {
      position: relative;
      background: #f5f5f5;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    /* Side posters (smaller) */
    .poster-slot-1,
    .poster-slot-3 {
      width: 220px;
      height: 320px;
      border: 2px solid #d4af37;
    }

    .poster-slot-1 img,
    .poster-slot-3 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Center poster (larger) */
    .poster-slot-2 {
      width: 280px;
      height: 400px;
      border: 3px solid #d4af37;
      z-index: 10;
      transform: scale(1.05);
    }

    .poster-slot-2 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Gold divider lines */
    .divider-line {
      position: absolute;
      background: #d4af37;
      opacity: 0.4;
    }

    .divider-vertical {
      width: 2px;
      height: 150px;
      top: 50%;
      transform: translateY(-50%);
      left: calc(50% - 165px);
    }

    .divider-vertical.right {
      left: calc(50% + 165px);
    }

    /* Price badges */
    .price-badge {
      position: absolute;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid #d4af37;
      padding: 8px 16px;
      color: #d4af37;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      width: 220px;
      top: calc(150px + 320px + 20px);
    }

    .price-badge.left {
      left: calc(50% - 230px - 110px);
    }

    .price-badge.center {
      left: calc(50% - 140px);
    }

    .price-badge.right {
      left: calc(50% + 110px);
    }

    /* CTA section at bottom */
    .cta-section {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
    }

    .cta-section h2 {
      font-family: 'Playfair Display', serif, sans-serif;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 3px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .cta-button {
      display: inline-block;
      padding: 12px 40px;
      border: 2px solid #d4af37;
      color: #d4af37;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      background: #d4af37;
      color: #0f0f0f;
    }

    /* Subtle animation for center poster */
    @keyframes subtle-lift {
      0%, 100% { transform: scale(1.05) translateY(0px); }
      50% { transform: scale(1.05) translateY(-8px); }
    }

    .poster-slot-2 {
      animation: subtle-lift 4s ease-in-out infinite;
    }

    /* Glow effect for borders */
    @keyframes border-glow {
      0%, 100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
      50% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
    }

    .poster-slot {
      animation: border-glow 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="texture-overlay"></div>

    <!-- Brand title -->
    <div class="brand-title">LUMERIES</div>

    <!-- Showcase container -->
    <div class="showcase-container">
      <!-- Left poster -->
      <div class="poster-slot poster-slot-1">
        <img src="" alt="Poster 1" id="posterImage1" style="display:none;">
      </div>

      <!-- Divider left -->
      <div class="divider-line divider-vertical"></div>

      <!-- Center poster (featured) -->
      <div class="poster-slot poster-slot-2">
        <img src="" alt="Poster 2" id="posterImage2" style="display:none;">
      </div>

      <!-- Divider right -->
      <div class="divider-line divider-vertical right"></div>

      <!-- Right poster -->
      <div class="poster-slot poster-slot-3">
        <img src="" alt="Poster 3" id="posterImage3" style="display:none;">
      </div>
    </div>

    <!-- Price badges -->
    <div class="price-badge left" id="priceBadge1">$24.99</div>
    <div class="price-badge center" id="priceBadge2">$29.99</div>
    <div class="price-badge right" id="priceBadge3">$24.99</div>

    <!-- CTA section -->
    <div class="cta-section">
      <h2>Discover the Collection</h2>
      <button class="cta-button">Shop Now</button>
    </div>
  </div>

  <script>
    // Poster URLs - set these to display your posters
    const POSTER_URLS = {
      left: '',
      center: '',
      right: ''
    };

    // Price values - customize as needed
    const PRICES = {
      left: '$24.99',
      center: '$29.99',
      right: '$24.99'
    };

    // Load posters if provided
    if (POSTER_URLS.left) {
      const img1 = document.getElementById('posterImage1');
      img1.src = POSTER_URLS.left;
      img1.style.display = 'block';
    }

    if (POSTER_URLS.center) {
      const img2 = document.getElementById('posterImage2');
      img2.src = POSTER_URLS.center;
      img2.style.display = 'block';
    }

    if (POSTER_URLS.right) {
      const img3 = document.getElementById('posterImage3');
      img3.src = POSTER_URLS.right;
      img3.style.display = 'block';
    }

    // Update prices if needed
    document.getElementById('priceBadge1').textContent = PRICES.left;
    document.getElementById('priceBadge2').textContent = PRICES.center;
    document.getElementById('priceBadge3').textContent = PRICES.right;

    // CTA button click handler
    document.querySelector('.cta-button').addEventListener('click', function() {
      console.log('Shop Now button clicked');
      // Add your shop link or action here
    });
  </script>
</body>
</html>
